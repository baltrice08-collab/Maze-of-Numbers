        .firefly {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399, 0 0 20px #10b981;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            animation: moveFirefly 15s linear infinite, glowFirefly 3s ease-in-out infinite;
        }

        @keyframes moveFirefly {
            0% { transform: translate(0, 0); }
            25% { transform: translate(100px, -50px); }
            50% { transform: translate(50px, -150px); }
            75% { transform: translate(-50px, -100px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes glowFirefly {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.6; }
        }

body{background:#0a0f0a;font-family:'Plus Jakarta Sans',system-ui,sans-serif;isolation:isolate}
main{z-index:2;width:min(100%,540px)}
.fireflies{z-index:1}
.card{background:rgba(10,22,12,.92);backdrop-filter:blur(25px);border:1px solid rgba(52,211,153,.2);box-shadow:0 20px 60px rgba(0,0,0,.7);border-radius:40px}
h1{font-family:'Cinzel',Georgia,serif;font-size:clamp(2.4rem,8vw,3.7rem);font-weight:900;line-height:1.1;background:linear-gradient(to right,#34d399 10%,#a7f3d0 30%,#fff 50%,#a7f3d0 70%,#34d399 90%);background-size:200% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 5s linear infinite;text-shadow:0 0 30px #34d39940}
@keyframes shine{to{background-position:200% center}}
.primary{border-radius:999px;background:#059669;border-color:#059669;color:white;padding:16px 26px}
.primary:hover:not(:disabled){background:#10b981}
.stats{background:rgba(0,0,0,.7)}
.eyebrow{font-family:'Cinzel',Georgia,serif}
@media(prefers-reduced-motion:reduce){.firefly{opacity:.6;animation:none}h1{animation:none}}
</style>
</head>
<body>
<div class="forest-bg" aria-hidden="true"></div>
<div class="fireflies" aria-hidden="true" id="fireflies"></div>
<main>
<section class="card center" id="start-screen">
<p class="eyebrow">Petualangan matematika</p><h1>MAZE OF<br>NUMBERS</h1>
<p>Misteri Labirin Logika</p>
<p class="rules">10 soal · 3 nyawa</p>
<button class="primary" id="start">Mulai Eksplorasi →</button>
<p class="muted" style="margin:24px 0 0">Skor terbaik: <strong data-best>0</strong></p>
<p class="muted" id="storage-note">Skor terbaik disimpan di browser ini.</p>
</section>
<section id="quiz-screen" hidden aria-label="Permainan">
<div class="stats"><div><small>Skor</small><strong id="score">0</strong></div><div><small>Rekor</small><strong data-best>0</strong></div><div><small>Nyawa</small><strong id="hearts"></strong></div></div>
<div class="card">
<div id="maze-map" class="map" aria-label="Progres tahap"></div>
<div class="row"><span id="level-label"></span><span id="timer-text" role="timer"></span></div>
<progress id="timer-bar" class="timer" max="100" value="100" aria-label="Sisa waktu"></progress>
<p class="story" id="story"></p><h2 id="question" tabindex="-1"></h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" hidden><p id="feedback-title" role="status"></p><p id="explanation"></p><button id="next" class="primary">Lanjut →</button></div>
</div>
</section>
<section class="card center" id="end-screen" hidden><p class="eyebrow">Hasil petualangan</p><h2 id="end-title" tabindex="-1"></h2><div id="final-score" class="big-score"></div><p id="end-message"></p><p class="muted">Skor terbaik: <strong data-best>0</strong></p><button id="restart" class="primary">Main Lagi ↻</button><button id="home" class="primary" hidden>Kembali ke Home</button></section>
<noscript>Aktifkan JavaScript di browser untuk memainkan game ini.</noscript>
</main>
<script>
'use strict';
let questions = [];
let previousVariants = [];
function shuffle(items) {
 const result = [...items];
 for (let i = result.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [result[i], result[j]] = [result[j], result[i]];
 }
 return result;
}
function fraction(n, d) {
 function gcd(a,b) { return b ? gcd(b,a%b) : a; }
 const g = gcd(Math.abs(n), Math.abs(d)); n /= g; d /= g;
 return d === 1 ? String(n) : `${n}/${d}`;
}
function makeQuestion(s,q,answer,wrong,explanation) {
 const options = shuffle([String(answer), ...wrong.map(String)]);
 if (new Set(options).size !== 4) throw new Error('Pilihan jawaban harus unik.');
 return {s,q,options,correct:options.indexOf(String(answer)),explanation};
}
const questionBuilders = [
 v => {
  const x=v+2, b=2+v%2, k=1+v%3, power=b**(x+k), answer=x*x-x;
  return makeQuestion('Gerbang hutan meminta nilai eksponen.',`Jika ${b}^(x + ${k}) = ${power}, berapakah x² − x?`,answer,[answer+x,answer-x,answer+2*x],`${power} = ${b}^${x+k}, jadi x + ${k} = ${x+k} dan x = ${x}. Maka x² − x = ${answer}.`);
 },
 v => {
  const a=v+2,b=v+1,answer=fraction(a,b);
  return makeQuestion('Jembatan kuno menguji ketelitianmu.',`Nilai limit x → 0 dari sin(${a}x) / (${b}x) adalah… (x dalam radian)`,answer,[fraction(a+1,b),fraction(a+2,b),fraction(a+3,b)],`Gunakan limit sin(u)/u = 1 saat u → 0. Hasilnya ${a}/${b} = ${answer}.`);
 },
 v => {
  const k=v+1,answer=`${k} sin(${2*k}x)`;
  return makeQuestion('Laju energi membuka penghalang berikutnya.',`Jika f(x) = sin²(${k}x), maka f′(x) = … (x dalam radian)`,answer,[`${2*k} sin(${2*k}x)`,`${k} cos(${2*k}x)`,`${k} sin(${k}x)`],`Aturan rantai memberi ${2*k} sin(${k}x) cos(${k}x). Dengan identitas sudut ganda, hasilnya ${answer}.`);
 },
 v => {
  const a=v+2,d=v+1,u2=a+d,u6=a+5*d,n=8+v,answer=a+(n-1)*d;
  return makeQuestion('Pola ubin menunjukkan jalan tersembunyi.',`Barisan aritmetika memiliki U₂ = ${u2} dan U₆ = ${u6}. Berapakah U${n}?`,answer,[answer-d,answer+d,answer+2*d],`Beda d = (${u6} − ${u2})/4 = ${d}. U${n} = U₂ + (${n} − 2)d = ${answer}.`);
 },
 v => {
  const a=v+1,b=v+2,c=v+3,t=2+v%2,num=2*a*t**3-3*b*t*t+6*c*t,answer=fraction(num,6);
  return makeQuestion('Isi bejana untuk membuka pintu batu.',`Nilai integral ∫₀^${t} (${a}x² − ${b}x + ${c}) dx adalah…`,answer,[fraction(num+6,6),fraction(num-6,6),fraction(num+12,6)],`Antiturunannya (${a}/3)x³ − (${b}/2)x² + ${c}x. Substitusi batas ${t} dan 0 menghasilkan ${answer}.`);
 },
 v => {
  const n=v+4,answer=n*(n-1)*(n-2);
  return makeQuestion('Susun simbol pada peti penjaga.',`Ada ${n} simbol berbeda. Berapa kode berurutan sepanjang 3 simbol yang dapat dibuat tanpa pengulangan?`,answer,[answer/6,n**3,answer+n],`Urutan penting. Pilihan berturut-turut: ${n}, ${n-1}, lalu ${n-2}. Jadi ${n} × ${n-1} × ${n-2} = ${answer}.`);
 },
 v => {
  const k=v+1,n=2**k*9,answer=`${k}a + 2b`;
  return makeQuestion('Fragmen logaritma melengkapi peta.',`Jika log 2 = a dan log 3 = b, maka log ${n} = … (basis 10)`,answer,[`${k}a + b`,`${k+1}a + 2b`,`${k}a + 3b`],`${n} = 2^${k} × 3². Dengan aturan logaritma, log ${n} = ${answer}.`);
 },
 v => {
  const p=v+1,q=v+3,sum=p+q,product=p*q,answer=p*p+q*q;
  return makeQuestion('Seimbangkan dua pilar terakhir.',`Akar-akar x² − ${sum}x + ${product} = 0 adalah p dan q. Berapakah p² + q²?`,answer,[answer+product,answer+2*product,answer+1],`p + q = ${sum} dan pq = ${product}. Maka p² + q² = ${sum}² − 2(${product}) = ${answer}.`);
 },
 v => {
  const red=v+3,blue=v+2,total=red+blue,num=red*(red-1),den=total*(total-1),answer=fraction(num,den);
  return makeQuestion('Pilih kristal untuk melewati penjaga.',`Kantong berisi ${red} bola merah dan ${blue} biru. Diambil 2 tanpa pengembalian. Peluang keduanya merah adalah…`,answer,[fraction(num+2,den),fraction(num-2,den),fraction(num+4,den)],`Peluang = (${red}/${total}) × (${red-1}/${total-1}) = ${answer}. Bola pertama tidak dikembalikan.`);
 },
 v => {
  const a=20+5*v,answer=`{${a}°, ${360-a}°}`;
  return makeQuestion('Koordinat sudut membuka jalan keluar.',`Penyelesaian cos x = cos ${a}° untuk 0° ≤ x ≤ 360° adalah…`,answer,[`{${a}°, ${180-a}°}`,`{${180-a}°, ${180+a}°}`,`{${a}°, ${180+a}°}`],`cos x = cos α berarti x = 360°k ± α. Dalam rentang yang diberikan: x = ${a}° atau 360° − ${a}° = ${360-a}°.`);
 }
];
function generateQuestions() {
 const variants = questionBuilders.map((_,i) => {
  const available = Array.from({length:8},(_,j)=>j+1).filter(v=>v!==previousVariants[i]);
  return available[Math.floor(Math.random()*available.length)];
 });
 previousVariants = variants;
 return questionBuilders.map((build,i)=>build(variants[i]));
}
const $ = id => document.getElementById(id);
const BEST_KEY = 'maze-of-numbers-best-v2';
let current = 0, score = 0, lives = 3, correctCount = 0, answered = 0;
let timer = null, deadline = 0, duration = 0, locked = true, best = 0;
try { const value = Number(localStorage.getItem(BEST_KEY)); if (Number.isFinite(value) && value >= 0) best = value; }
catch { $('storage-note').textContent = 'Penyimpanan browser tidak tersedia; rekor hanya berlaku selama halaman ini terbuka.'; }
function showBest() { document.querySelectorAll('[data-best]').forEach(el => el.textContent = best); }
function saveBest() {
 if (score <= best) return;
 best = score; showBest();
 try { localStorage.setItem(BEST_KEY, String(best)); } catch { $('storage-note').textContent = 'Rekor hanya tersimpan selama halaman ini terbuka.'; }
}
function showScreen(id) { ['start-screen','quiz-screen','end-screen'].forEach(key => $(key).hidden = key !== id); }
function updateStats() { $('score').textContent = score; $('hearts').textContent = '♥'.repeat(lives) + '♡'.repeat(3-lives); $('hearts').setAttribute('aria-label', lives + ' nyawa tersisa'); }
function startGame() {
 clearInterval(timer); current = 0; score = 0; lives = 3; correctCount = 0; answered = 0;
 questions = generateQuestions();
 showScreen('quiz-screen'); updateStats(); loadQuestion();
}
function renderTime() {
 const remaining = Math.max(0, deadline - performance.now());
 $('timer-text').textContent = Math.ceil(remaining / 1000) + ' detik';
 $('timer-bar').value = remaining / duration * 100;
 return remaining;
}
function loadQuestion() {
 clearInterval(timer); locked = false;
 const q = questions[current];
 $('feedback').hidden = true;
 $('level-label').textContent = `Tahap ${current + 1} / ${questions.length}`;
 $('story').textContent = q.s; $('question').textContent = q.q;
 $('maze-map').replaceChildren();
 questions.forEach((_, i) => { const node = document.createElement('span'); node.className = 'node' + (i < current ? ' passed' : i === current ? ' active' : ''); $('maze-map').append(node); });
 $('maze-map').setAttribute('aria-label', `Tahap ${current + 1} dari ${questions.length}`);
 $('options').replaceChildren();
 q.options.forEach((option, i) => {
  const button = document.createElement('button'); button.className = 'option';
  const letter = document.createElement('span'); letter.className = 'letter'; letter.textContent = String.fromCharCode(65+i);
  const label = document.createElement('span'); label.textContent = option; button.append(letter,label);
  button.addEventListener('click', () => submitAnswer(i)); $('options').append(button);
 });
 duration = (current < 6 ? 50 : 35) * 1000;
 deadline = performance.now() + duration; renderTime();
 timer = setInterval(() => { if (!locked && renderTime() <= 0) submitAnswer(null); }, 100);
 $('question').focus();
}
function submitAnswer(index) {
 if (locked) return;
 const remaining = renderTime();
 if (remaining <= 0) index = null;
 locked = true; clearInterval(timer); answered++;
 const q = questions[current], correct = index === q.correct;
 if (correct) { correctCount++; score += 100 + Math.ceil(remaining / 1000) * 2; saveBest(); } else lives = Math.max(0, lives-1);
 updateStats();
 if (lives === 0) { endGame(); return; }
 Array.from($('options').children).forEach((button, i) => {
  button.disabled = true;
  if (i === q.correct) button.classList.add('correct');
  else if (i === index) button.classList.add('wrong');
 });
 $('feedback-title').textContent = correct ? '✓ Benar!' : index === null ? 'Waktu habis — 1 nyawa berkurang.' : 'Belum tepat — 1 nyawa berkurang.';
 $('explanation').textContent = `Jawaban: ${q.options[q.correct]}. ${q.explanation}`;
 $('next').textContent = current === questions.length-1 ? 'Lihat Hasil →' : 'Tahap Berikutnya →';
 $('feedback').hidden = false; $('next').focus();
}
function advance() {
 if (!locked || $('feedback').hidden || $('quiz-screen').hidden) return;
 $('feedback').hidden = true;
 if (current === questions.length-1) endGame();
 else { current++; loadQuestion(); }
}
function returnHome() {
 locked = true; clearInterval(timer); saveBest();
 $('feedback').hidden = true; showScreen('start-screen'); $('start').focus();
}
function endGame() {
 locked = true; clearInterval(timer); saveBest(); showScreen('end-screen');
 $('end-title').textContent = lives > 0 ? 'MISI SELESAI' : 'GAME OVER';
 $('final-score').textContent = score;
 $('end-message').textContent = `${correctCount} jawaban benar dari ${answered} soal yang dimainkan. ` + (lives > 0 ? 'Kamu berhasil keluar dari labirin!' : 'Nyawa habis. Kembali ke home untuk mencoba lagi.');
 $('restart').hidden = lives === 0;
 $('home').hidden = lives > 0;
 $('end-title').focus();
}
$('home').addEventListener('click', returnHome);
$('start').addEventListener('click', startGame); $('restart').addEventListener('click', startGame); $('next').addEventListener('click', advance);
for (let i=0;i<15;i++) { const fly=document.createElement('span'); fly.className='firefly'; fly.style.left=Math.random()*100+'%'; fly.style.top=Math.random()*100+'%'; fly.style.animationDelay=(-Math.random()*15)+'s, '+(-Math.random()*3)+'s'; $('fireflies').append(fly); }
showBest();
</script>
</body>
</html>
